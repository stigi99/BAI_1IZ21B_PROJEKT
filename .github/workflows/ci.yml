name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go, Templ and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Generate Templ views
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate ./internal/views

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Run Go tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration -count=1 -v .

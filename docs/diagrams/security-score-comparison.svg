<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Security score comparison">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Porównanie efektu zabezpieczeń</text>
<text x="80" y="132" class="sub">Wykres pokazuje, jak tryb secure zmienia wynik scenariuszy: atak ma pozostać danymi albo</text>
<text x="80" y="160" class="sub">zostać odrzucony.</text>
<rect x="180" y="333.5" width="54" height="446.5" rx="12" fill="#fb7185"/>
<rect x="242" y="742.4" width="54" height="37.6" rx="12" fill="#10b981"/>
<text x="238" y="826" text-anchor="middle" class="tick">SQLi</text>
<rect x="345" y="357.0" width="54" height="423.0" rx="12" fill="#fb7185"/>
<rect x="407" y="723.6" width="54" height="56.4" rx="12" fill="#10b981"/>
<text x="403" y="826" text-anchor="middle" class="tick">XSS</text>
<rect x="510" y="380.5" width="54" height="399.5" rx="12" fill="#fb7185"/>
<rect x="572" y="695.4" width="54" height="84.6" rx="12" fill="#10b981"/>
<text x="568" y="826" text-anchor="middle" class="tick">Auth</text>
<rect x="675" y="404.0" width="54" height="376.0" rx="12" fill="#fb7185"/>
<rect x="737" y="733.0" width="54" height="47.0" rx="12" fill="#10b981"/>
<text x="733" y="826" text-anchor="middle" class="tick">IDOR</text>
<rect x="840" y="427.5" width="54" height="352.5" rx="12" fill="#fb7185"/>
<rect x="902" y="742.4" width="54" height="37.6" rx="12" fill="#10b981"/>
<text x="898" y="826" text-anchor="middle" class="tick">CSRF</text>
<rect x="1005" y="366.4" width="54" height="413.6" rx="12" fill="#fb7185"/>
<rect x="1067" y="686.0" width="54" height="94.0" rx="12" fill="#10b981"/>
<text x="1063" y="826" text-anchor="middle" class="tick">Data</text>
<rect x="1170" y="394.6" width="54" height="385.4" rx="12" fill="#fb7185"/>
<rect x="1232" y="733.0" width="54" height="47.0" rx="12" fill="#10b981"/>
<text x="1228" y="826" text-anchor="middle" class="tick">LFI</text>
<rect x="1335" y="357.0" width="54" height="423.0" rx="12" fill="#fb7185"/>
<rect x="1397" y="747.1" width="54" height="32.900000000000006" rx="12" fill="#10b981"/>
<text x="1393" y="826" text-anchor="middle" class="tick">CMD</text>
<line x1="120" y1="780.0" x2="1490" y2="780.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="95" y="787.0" text-anchor="end" class="tick">0%</text>
<line x1="120" y1="662.5" x2="1490" y2="662.5" stroke="#e2e8f0" stroke-width="2"/>
<text x="95" y="669.5" text-anchor="end" class="tick">25%</text>
<line x1="120" y1="545.0" x2="1490" y2="545.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="95" y="552.0" text-anchor="end" class="tick">50%</text>
<line x1="120" y1="427.5" x2="1490" y2="427.5" stroke="#e2e8f0" stroke-width="2"/>
<text x="95" y="434.5" text-anchor="end" class="tick">75%</text>
<line x1="120" y1="310.0" x2="1490" y2="310.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="95" y="317.0" text-anchor="end" class="tick">100%</text>
<text x="120" y="185" class="axis">Skuteczność ataku / ekspozycja ryzyka</text>
<rect x="1010" y="165" width="180" height="54" rx="27" fill="#fb7185" filter="url(#shadow)"/>
<text x="1100.0" y="200" text-anchor="middle" class="pill" fill="#ffffff">vulnerable</text>
<rect x="1210" y="165" width="145" height="54" rx="27" fill="#10b981" filter="url(#shadow)"/>
<text x="1282.5" y="200" text-anchor="middle" class="pill" fill="#ffffff">secure</text>
</svg>
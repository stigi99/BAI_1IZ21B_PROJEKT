<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="HTTP request lifecycle">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Cykl życia żądania HTTP</text>
<text x="80" y="132" class="sub">Miejsca, w których dane użytkownika muszą zostać potraktowane jako niezaufane.</text>
<rect x="80" y="320" width="245" height="210" rx="20" fill="#ffffff" stroke="#ec4899" stroke-width="3" filter="url(#shadow)"/>
<circle cx="122" cy="362" r="28" fill="#ec4899"/>
<text x="122" y="371" text-anchor="middle" class="pill" fill="#fff">1</text>
<text x="166" y="370" class="box-title" fill="#0f172a">Input</text>
<text x="110" y="410" class="small">formularz, URL,</text>
<text x="110" y="438" class="small">JSON, upload</text>
<line x1="325" y1="425" x2="395" y2="425" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="395" y="320" width="245" height="210" rx="20" fill="#ffffff" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
<circle cx="437" cy="362" r="28" fill="#3b82f6"/>
<text x="437" y="371" text-anchor="middle" class="pill" fill="#fff">2</text>
<text x="481" y="370" class="box-title" fill="#0f172a">Router</text>
<text x="425" y="410" class="small">wybór endpointu</text>
<text x="425" y="438" class="small">main.go</text>
<line x1="640" y1="425" x2="710" y2="425" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="710" y="320" width="245" height="210" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
<circle cx="752" cy="362" r="28" fill="#8b5cf6"/>
<text x="752" y="371" text-anchor="middle" class="pill" fill="#fff">3</text>
<text x="796" y="370" class="box-title" fill="#0f172a">Handler</text>
<text x="740" y="410" class="small">sesja, token, tryb</text>
<text x="740" y="438" class="small">handlers.go</text>
<line x1="955" y1="425" x2="1025" y2="425" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1025" y="320" width="245" height="210" rx="20" fill="#ffffff" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
<circle cx="1067" cy="362" r="28" fill="#f97316"/>
<text x="1067" y="371" text-anchor="middle" class="pill" fill="#fff">4</text>
<text x="1111" y="370" class="box-title" fill="#0f172a">Service</text>
<text x="1055" y="410" class="small">SQL, auth, XSS</text>
<text x="1055" y="438" class="small">service.go</text>
<line x1="1270" y1="425" x2="1340" y2="425" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1340" y="320" width="245" height="210" rx="20" fill="#ffffff" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
<circle cx="1382" cy="362" r="28" fill="#10b981"/>
<text x="1382" y="371" text-anchor="middle" class="pill" fill="#fff">5</text>
<text x="1426" y="370" class="box-title" fill="#0f172a">DB / OS</text>
<text x="1370" y="410" class="small">SQLite, pliki,</text>
<text x="1370" y="438" class="small">ping</text>
<rect x="160" y="760" width="1280" height="54" rx="27" fill="#0f172a" filter="url(#shadow)"/>
<text x="800.0" y="795" text-anchor="middle" class="pill" fill="#ffffff">Kontrole: sesja, CSRF, autoryzacja, parametryzowany SQL, bcrypt, escaping, whitelisty ścieżek i brak shella.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-label="Architecture deep dive">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1100" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Architektura aplikacji i punkty kontroli</text>
<text x="80" y="132" class="sub">Ścieżka żądania, warstwy danych oraz miejsca, w których zapada decyzja vulnerable/secure.</text>
<rect x="90" y="210" width="235" height="130" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
<text x="116" y="254" class="box-title" fill="#0f172a">Browser</text>
<text x="116" y="292" class="small">formularze, query</text>
<text x="116" y="320" class="small">string</text>
<text x="116" y="348" class="small">cookies, uploady</text>
<rect x="435" y="210" width="235" height="130" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3" filter="url(#shadow)"/>
<text x="461" y="254" class="box-title" fill="#0f172a">Gin Router</text>
<text x="461" y="292" class="small">routing UI / API</text>
<text x="461" y="320" class="small">main.go</text>
<rect x="780" y="210" width="235" height="130" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="3" filter="url(#shadow)"/>
<text x="806" y="254" class="box-title" fill="#0f172a">Handlers</text>
<text x="806" y="292" class="small">sesja, CSRF</text>
<text x="806" y="320" class="small">currentUsername</text>
<rect x="1125" y="210" width="235" height="130" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1151" y="254" class="box-title" fill="#0f172a">Service</text>
<text x="1151" y="292" class="small">SQL, hasła</text>
<text x="1151" y="320" class="small">SavePost</text>
<line x1="325" y1="275" x2="435" y2="275" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="670" y1="275" x2="780" y2="275" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1015" y1="275" x2="1125" y2="275" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="540" width="270" height="135" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
<text x="116" y="584" class="box-title" fill="#0f172a">SQLite</text>
<text x="116" y="622" class="small">posts, users, comments</text>
<text x="116" y="650" class="small">SQLi + data exposure</text>
<rect x="505" y="540" width="270" height="135" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
<text x="531" y="584" class="box-title" fill="#0f172a">Filesystem</text>
<text x="531" y="622" class="small">uploads + attachments</text>
<text x="531" y="650" class="small">path traversal</text>
<rect x="920" y="540" width="270" height="135" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" filter="url(#shadow)"/>
<text x="946" y="584" class="box-title" fill="#0f172a">OS Process</text>
<text x="946" y="622" class="small">ping command</text>
<text x="946" y="650" class="small">command injection boundary</text>
<line x1="552" y1="340" x2="225" y2="540" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="552" y1="340" x2="640" y2="540" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="898" y1="340" x2="1055" y2="540" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="470" y="750" width="660" height="54" rx="27" fill="#0f172a" filter="url(#shadow)"/>
<text x="800.0" y="785" text-anchor="middle" class="pill" fill="#ffffff">ModeStore decyduje o ścieżce w jednym spójnym miejscu</text>
<rect x="120" y="860" width="600" height="54" rx="27" fill="#fb5a42" filter="url(#shadow)"/>
<text x="420.0" y="895" text-anchor="middle" class="pill" fill="#ffffff">VULNERABLE: SQL concat, raw HTML, no CSRF</text>
<rect x="870" y="860" width="600" height="54" rx="27" fill="#0ea5a8" filter="url(#shadow)"/>
<text x="1170.0" y="895" text-anchor="middle" class="pill" fill="#ffffff">SECURE: placeholders, escaping, bcrypt, token</text>
</svg>
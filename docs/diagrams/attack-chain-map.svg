<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Attack chain map">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1080" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Mapa łańcuchów ataku</text>
<text x="80" y="132" class="sub">Pojedyncze podatności są w projekcie izolowane, ale w realnym incydencie mogą wzmacniać się</text>
<text x="80" y="160" class="sub">nawzajem.</text>
<rect x="80" y="210" width="300" height="135" rx="20" fill="#fff7ed" stroke="#fb7185" stroke-width="3" filter="url(#shadow)"/>
<text x="106" y="254" class="box-title" fill="#0f172a">SQL Injection</text>
<text x="106" y="292" class="small">schema, users, hidden drafts</text>
<rect x="80" y="470" width="300" height="135" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
<text x="106" y="514" class="box-title" fill="#0f172a">Path Traversal</text>
<text x="106" y="552" class="small">source code / app.db</text>
<rect x="515" y="330" width="350" height="155" rx="20" fill="#fff1f2" stroke="#fb7185" stroke-width="3" filter="url(#shadow)"/>
<text x="541" y="374" class="box-title" fill="#0f172a">Sensitive Data</text>
<text x="541" y="412" class="small">plaintext password_hash</text>
<text x="541" y="440" class="small">dane kont i sesji</text>
<rect x="1010" y="230" width="335" height="145" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="1036" y="274" class="box-title" fill="#0f172a">Broken Auth</text>
<text x="1036" y="312" class="small">dowolne hasło</text>
<text x="1036" y="340" class="small">znany login</text>
<rect x="1180" y="525" width="300" height="145" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="3" filter="url(#shadow)"/>
<text x="1206" y="569" class="box-title" fill="#0f172a">IDOR</text>
<text x="1206" y="607" class="small">usuwanie cudzych postów</text>
<rect x="260" y="760" width="300" height="145" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="286" y="804" class="box-title" fill="#0f172a">Stored XSS</text>
<text x="286" y="842" class="small">fake login overlay</text>
<rect x="720" y="760" width="300" height="145" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
<text x="746" y="804" class="box-title" fill="#0f172a">CSRF</text>
<text x="746" y="842" class="small">mutacja bez intencji</text>
<rect x="1120" y="820" width="300" height="145" rx="20" fill="#0f172a" stroke="#0f172a" stroke-width="3" filter="url(#shadow)"/>
<text x="1146" y="864" class="box-title" fill="#ffffff">Command Injection</text>
<text x="1146" y="902" class="small">wykonanie komendy</text>
<path d="M380 278 C445 278 465 360 515 392" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="450" y="300" text-anchor="middle" class="label" fill="#e11d48">wyciek users</text>
<path d="M380 538 C450 538 460 450 515 430" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="450" y="520" text-anchor="middle" class="label" fill="#e11d48">wyciek DB</text>
<path d="M865 390 C940 350 955 300 1010 300" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="942" y="338" text-anchor="middle" class="label" fill="#e11d48">hasła jawne</text>
<path d="M1178 375 C1220 430 1250 485 1280 525" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="1265" y="445" text-anchor="middle" class="label" fill="#e11d48">sesja</text>
<path d="M560 832 C625 832 660 832 720 832" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="640" y="810" text-anchor="middle" class="label" fill="#0ea5e9">żądanie w kontekście ofiary</text>
<path d="M1020 845 C1070 845 1090 875 1120 895" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="1095" y="850" text-anchor="middle" class="label" fill="#e11d48">eskalacja</text>
<rect x="90" y="980" width="610" height="54" rx="27" fill="#fff" filter="url(#shadow)"/>
<text x="395.0" y="1015" text-anchor="middle" class="pill" fill="#e11d48">Czerwone strzałki: możliwy łańcuch ataku</text>
<rect x="900" y="980" width="520" height="54" rx="27" fill="#fff" filter="url(#shadow)"/>
<text x="1160.0" y="1015" text-anchor="middle" class="pill" fill="#0369a1">Niebieska strzałka: akcja przeglądarki ofiary</text>
</svg>
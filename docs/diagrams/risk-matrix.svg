<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="Risk matrix">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1040" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Macierz ryzyka podatności</text>
<text x="80" y="132" class="sub">Ocena orientacyjna dla aplikacji laboratoryjnej: prawdopodobieństwo kontra skutek.</text>
<rect x="430" y="725" width="165" height="165" fill="#dcfce7" stroke="#ffffff" stroke-width="4"/>
<rect x="595" y="725" width="165" height="165" fill="#bef264" stroke="#ffffff" stroke-width="4"/>
<rect x="760" y="725" width="165" height="165" fill="#fde68a" stroke="#ffffff" stroke-width="4"/>
<rect x="925" y="725" width="165" height="165" fill="#fdba74" stroke="#ffffff" stroke-width="4"/>
<rect x="430" y="560" width="165" height="165" fill="#bbf7d0" stroke="#ffffff" stroke-width="4"/>
<rect x="595" y="560" width="165" height="165" fill="#fde68a" stroke="#ffffff" stroke-width="4"/>
<rect x="760" y="560" width="165" height="165" fill="#fdba74" stroke="#ffffff" stroke-width="4"/>
<rect x="925" y="560" width="165" height="165" fill="#fb7185" stroke="#ffffff" stroke-width="4"/>
<rect x="430" y="395" width="165" height="165" fill="#fde68a" stroke="#ffffff" stroke-width="4"/>
<rect x="595" y="395" width="165" height="165" fill="#fdba74" stroke="#ffffff" stroke-width="4"/>
<rect x="760" y="395" width="165" height="165" fill="#fb7185" stroke="#ffffff" stroke-width="4"/>
<rect x="925" y="395" width="165" height="165" fill="#e11d48" stroke="#ffffff" stroke-width="4"/>
<rect x="430" y="230" width="165" height="165" fill="#fdba74" stroke="#ffffff" stroke-width="4"/>
<rect x="595" y="230" width="165" height="165" fill="#fb7185" stroke="#ffffff" stroke-width="4"/>
<rect x="760" y="230" width="165" height="165" fill="#e11d48" stroke="#ffffff" stroke-width="4"/>
<rect x="925" y="230" width="165" height="165" fill="#9f1239" stroke="#ffffff" stroke-width="4"/>
<rect x="430" y="230" width="660" height="660" rx="22" fill="none" stroke="#cbd5e1" stroke-width="4"/>
<text x="512.5" y="948" text-anchor="middle" class="tick">niskie</text>
<text x="388" y="815.5" text-anchor="end" class="tick">niskie</text>
<text x="677.5" y="948" text-anchor="middle" class="tick">średnie</text>
<text x="388" y="650.5" text-anchor="end" class="tick">średnie</text>
<text x="842.5" y="948" text-anchor="middle" class="tick">wysokie</text>
<text x="388" y="485.5" text-anchor="end" class="tick">wysokie</text>
<text x="1007.5" y="948" text-anchor="middle" class="tick">krytyczne</text>
<text x="388" y="320.5" text-anchor="end" class="tick">krytyczne</text>
<text x="760" y="1000" text-anchor="middle" class="axis">Skutek</text>
<text x="230" y="560" transform="rotate(-90 230 560)" text-anchor="middle" class="axis">Prawdopodobieństwo</text>
<rect x="941.5" y="248" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="1007.5" y="277" text-anchor="middle" class="tick">Broken Auth</text>
<rect x="941.5" y="302" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="1007.5" y="331" text-anchor="middle" class="tick">SQLi</text>
<rect x="941.5" y="356" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="1007.5" y="385" text-anchor="middle" class="tick">Cmd Inj.</text>
<rect x="941.5" y="413" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="1007.5" y="442" text-anchor="middle" class="tick">IDOR</text>
<rect x="776.5" y="413" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="842.5" y="442" text-anchor="middle" class="tick">LFI</text>
<rect x="611.5" y="413" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="677.5" y="442" text-anchor="middle" class="tick">XSS</text>
<rect x="776.5" y="578" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="842.5" y="607" text-anchor="middle" class="tick">CSRF</text>
<rect x="611.5" y="578" width="132" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
<text x="677.5" y="607" text-anchor="middle" class="tick">Data Exposure</text>
<rect x="1190" y="290" width="285" height="380" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
<text x="1216" y="334" class="box-title" fill="#0f172a">Legenda</text>
<text x="1216" y="372" class="small">zielony: niskie</text>
<text x="1216" y="400" class="small">żółty: średnie</text>
<text x="1216" y="428" class="small">pomarańczowy: wysokie</text>
<text x="1216" y="456" class="small">czerwony: krytyczne</text>
<text x="1216" y="484" class="small">Ocena nie jest CVSS.</text>
<text x="1216" y="512" class="small">Służy do priorytetyzacji.</text>
</svg>
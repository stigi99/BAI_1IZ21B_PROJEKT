<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="BAI Security Lab architecture">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Architektura aplikacji BAI Security Lab</text>
<text x="80" y="132" class="sub">Warstwy aplikacji i miejsca, w których tryb secure zamienia podatne ścieżki na kontrolowane</text>
<text x="80" y="160" class="sub">zachowanie.</text>
<rect x="80" y="210" width="250" height="170" rx="20" fill="#fff1f2" stroke="#fb7185" stroke-width="3" filter="url(#shadow)"/>
<text x="106" y="254" class="box-title" fill="#0f172a">Klient</text>
<text x="106" y="292" class="small">Przeglądarka</text>
<text x="106" y="320" class="small">curl / Burp / Postman</text>
<text x="106" y="348" class="small">HTML, formularze, payloady</text>
<rect x="440" y="210" width="260" height="170" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="466" y="254" class="box-title" fill="#0f172a">Gin Router</text>
<text x="466" y="292" class="small">Routing endpointów</text>
<text x="466" y="320" class="small">API + UI + HTMX</text>
<text x="466" y="348" class="small">main.go</text>
<rect x="810" y="210" width="280" height="170" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="3" filter="url(#shadow)"/>
<text x="836" y="254" class="box-title" fill="#0f172a">Handlers</text>
<text x="836" y="292" class="small">HTTP, sesja, walidacja</text>
<text x="836" y="320" class="small">tryb vulnerable / secure</text>
<text x="836" y="348" class="small">internal/handlers</text>
<rect x="1210" y="210" width="250" height="170" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1236" y="254" class="box-title" fill="#0f172a">Views</text>
<text x="1236" y="292" class="small">Templ</text>
<text x="1236" y="320" class="small">HTML + HTMX</text>
<text x="1236" y="348" class="small">pages.templ</text>
<rect x="440" y="570" width="260" height="170" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
<text x="466" y="614" class="box-title" fill="#0f172a">Static / upload</text>
<text x="466" y="652" class="small">CSS, JS, grafiki</text>
<text x="466" y="680" class="small">uploady użytkownika</text>
<text x="466" y="708" class="small">static / assets</text>
<rect x="810" y="570" width="280" height="170" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
<text x="836" y="614" class="box-title" fill="#0f172a">Service</text>
<text x="836" y="652" class="small">Logika domenowa</text>
<text x="836" y="680" class="small">SQL, hasła, komentarze</text>
<text x="836" y="708" class="small">internal/service</text>
<rect x="1210" y="570" width="250" height="170" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
<text x="1236" y="614" class="box-title" fill="#0f172a">SQLite</text>
<text x="1236" y="652" class="small">blog, users, comments</text>
<text x="1236" y="680" class="small">migracje + seed</text>
<text x="1236" y="708" class="small">app.db</text>
<line x1="330" y1="295" x2="440" y2="295" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="700" y1="295" x2="810" y2="295" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1090" y1="295" x2="1210" y2="295" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M950 380 C920 470 830 510 700 590" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1090" y1="655" x2="1210" y2="655" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="700" y1="655" x2="810" y2="655" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="130" y="850" width="600" height="54" rx="27" fill="#fb5a42" filter="url(#shadow)"/>
<text x="430.0" y="885" text-anchor="middle" class="pill" fill="#ffffff">VULNERABLE: SQL concat, raw HTML, plaintext</text>
<rect x="875" y="850" width="600" height="54" rx="27" fill="#0ea5a8" filter="url(#shadow)"/>
<text x="1175.0" y="885" text-anchor="middle" class="pill" fill="#ffffff">SECURE: SQL params, walidacja, escaping, bcrypt</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Defense controls">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .h1 { font-size: 46px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 24px; font-weight: 500; fill: #475569; }
    .box-title { font-size: 26px; font-weight: 800; }
    .small { font-size: 22px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 18px; font-weight: 600; fill: #334155; }
    .label { font-size: 20px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .pill { font-size: 22px; font-weight: 800; }
    .axis { font-size: 21px; font-weight: 800; fill: #334155; }
    .tick { font-size: 19px; font-weight: 700; fill: #475569; }
  </style>
<rect width="1600" height="1080" rx="32" fill="url(#bg)"/>
<text x="80" y="90" class="h1">Mapa podatność -&gt; kontrola bezpieczeństwa</text>
<text x="80" y="132" class="sub">Każda podatność ma konkretny mechanizm naprawczy widoczny w kodzie i testach.</text>
<rect x="90" y="220" width="620" height="135" rx="20" fill="#ffffff" stroke="#f43f5e" stroke-width="3" filter="url(#shadow)"/>
<circle cx="142" cy="272" r="28" fill="#f43f5e"/>
<text x="142" y="281" text-anchor="middle" class="pill" fill="#fff">1</text>
<text x="195" y="270" class="box-title" fill="#0f172a">SQL Injection</text>
<text x="195" y="305" class="small">Kontrola: placeholders ?</text>
<text x="195" y="335" class="small">Kod/test: SearchPostsSecure</text>
<rect x="830" y="220" width="620" height="135" rx="20" fill="#ffffff" stroke="#ec4899" stroke-width="3" filter="url(#shadow)"/>
<circle cx="882" cy="272" r="28" fill="#ec4899"/>
<text x="882" y="281" text-anchor="middle" class="pill" fill="#fff">2</text>
<text x="935" y="270" class="box-title" fill="#0f172a">Stored XSS</text>
<text x="935" y="305" class="small">Kontrola: sanitize + escape</text>
<text x="935" y="335" class="small">Kod/test: safe comments</text>
<rect x="90" y="405" width="620" height="135" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
<circle cx="142" cy="457" r="28" fill="#8b5cf6"/>
<text x="142" y="466" text-anchor="middle" class="pill" fill="#fff">3</text>
<text x="195" y="455" class="box-title" fill="#0f172a">Broken Auth</text>
<text x="195" y="490" class="small">Kontrola: bcrypt + limiter</text>
<text x="195" y="520" class="small">Kod/test: ValidateUserCredentials</text>
<rect x="830" y="405" width="620" height="135" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="3" filter="url(#shadow)"/>
<circle cx="882" cy="457" r="28" fill="#6366f1"/>
<text x="882" y="466" text-anchor="middle" class="pill" fill="#fff">4</text>
<text x="935" y="455" class="box-title" fill="#0f172a">IDOR</text>
<text x="935" y="490" class="small">Kontrola: owner/admin check</text>
<text x="935" y="520" class="small">Kod/test: canDeletePost</text>
<rect x="90" y="590" width="620" height="135" rx="20" fill="#ffffff" stroke="#06b6d4" stroke-width="3" filter="url(#shadow)"/>
<circle cx="142" cy="642" r="28" fill="#06b6d4"/>
<text x="142" y="651" text-anchor="middle" class="pill" fill="#fff">5</text>
<text x="195" y="640" class="box-title" fill="#0f172a">CSRF</text>
<text x="195" y="675" class="small">Kontrola: token + SameSite</text>
<text x="195" y="705" class="small">Kod/test: csrf_token cookie</text>
<rect x="830" y="590" width="620" height="135" rx="20" fill="#ffffff" stroke="#14b8a6" stroke-width="3" filter="url(#shadow)"/>
<circle cx="882" cy="642" r="28" fill="#14b8a6"/>
<text x="882" y="651" text-anchor="middle" class="pill" fill="#fff">6</text>
<text x="935" y="640" class="box-title" fill="#0f172a">Sensitive Data</text>
<text x="935" y="675" class="small">Kontrola: bcrypt seed + register</text>
<text x="935" y="705" class="small">Kod/test: password_hash</text>
<rect x="90" y="775" width="620" height="135" rx="20" fill="#ffffff" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
<circle cx="142" cy="827" r="28" fill="#f97316"/>
<text x="142" y="836" text-anchor="middle" class="pill" fill="#fff">7</text>
<text x="195" y="825" class="box-title" fill="#0f172a">Path Traversal</text>
<text x="195" y="860" class="small">Kontrola: canonical path</text>
<text x="195" y="890" class="small">Kod/test: safeFilePath</text>
<rect x="830" y="775" width="620" height="135" rx="20" fill="#ffffff" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
<circle cx="882" cy="827" r="28" fill="#ef4444"/>
<text x="882" y="836" text-anchor="middle" class="pill" fill="#fff">8</text>
<text x="935" y="825" class="box-title" fill="#0f172a">Command Injection</text>
<text x="935" y="860" class="small">Kontrola: no shell + regex</text>
<text x="935" y="890" class="small">Kod/test: exec.Command</text>
<rect x="180" y="970" width="1240" height="54" rx="27" fill="#0f172a" filter="url(#shadow)"/>
<text x="800.0" y="1005" text-anchor="middle" class="pill" fill="#ffffff">Zasada wspólna: walidacja i autoryzacja są po stronie serwera, nie w UI.</text>
</svg>